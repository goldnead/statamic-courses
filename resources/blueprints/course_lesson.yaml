title: 'Course Lesson'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: course
            field:
              type: entries
              display: Course
              max_items: 1
              mode: select
              collections:
                - courses
              required: true
              validate:
                - required
          -
            handle: item_type
            field:
              type: select
              display: Type
              default: video
              instructions: 'How the lesson is completed: a video by watching, text, milestone, coaching and exercise by a click, quiz, assignment and reflection only by the site that checks them.'
              options:
                video: Video
                text: Text
                quiz: Quiz
                assignment: Assignment
                reflection: Reflection
                milestone: Milestone
                exercise: Exercise
                coaching: Coaching
          -
            handle: is_test_out
            field:
              type: toggle
              display: 'Test-out'
              default: false
              instructions: 'Stays open while its phase is locked. Passing it completes the earlier phases.'
          -
            handle: content
            field:
              type: markdown
              display: Content
          -
            handle: video_duration
            field:
              type: text
              display: 'Video duration'
              instructions: 'mm:ss, hh:mm:ss or seconds. Without it a video cannot complete itself by being watched.'
          -
            handle: est_minutes
            field:
              type: integer
              display: 'Estimated minutes'
      -
        display: Structure
        instructions: 'A later phase stays locked until every earlier phase is completed. With drip by schedule, a lesson opens in its week after enrollment.'
        fields:
          -
            handle: section_key
            field:
              type: text
              display: 'Section key'
              width: 33
          -
            handle: section_title
            field:
              type: text
              display: 'Section title'
              width: 33
          -
            handle: section_order
            field:
              type: integer
              display: 'Section order'
              width: 33
          -
            handle: sort_order
            field:
              type: integer
              display: 'Position in section'
              width: 33
          -
            handle: phase_key
            field:
              type: text
              display: 'Phase key'
              width: 33
          -
            handle: phase_title
            field:
              type: text
              display: 'Phase title'
              width: 33
          -
            handle: phase_order
            field:
              type: integer
              display: 'Phase order'
              width: 50
          -
            handle: week
            field:
              type: integer
              display: Week
              width: 50
          -
            handle: prerequisite_lessons
            field:
              type: entries
              display: Prerequisites
              collections:
                - course_lessons
              instructions: 'This lesson opens only after all of these are completed.'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              required: true
              validate:
                - required
